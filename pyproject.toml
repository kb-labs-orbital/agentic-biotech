[project]
name = "agentic-biotech"
version = "0.1.0"
description = "Biotech agentic automation POC that includes training and inference"
authors = [
    {name = "krishna.bhaskaran@icloud.com"}
]
readme = "README.md"
requires-python = "^3.10"
dependencies = [
    "llama-cpp-python (>=0.3.9,<0.4.0)",
    "fastapi (>=0.115.13,<0.116.0)",
    "uvicorn (>=0.34.3,<0.35.0)",
    "pydantic (>=2.11.7,<3.0.0)",
    "watchdog (>=6.0.0,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "biotech", from = "src" }]

[tool.poetry.group.dev.dependencies]
jupyter = "^1.1.1"
black = "^25.1.0"
huggingface-hub = "^0.33.0"
pytest = "^8.4.1"

